spring.application.name=ms-usuarios

logging.level.root=INFO
logging.level.org.hibernate=DEBUG
logging.level.org.springframework=DEBUG
# Evita que el DEBUG escriba claves, tokens y hashes en el log
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
logging.level.org.hibernate.orm.core=INFO
logging.level.cl.duoc.foro=${LOG_NIVEL:INFO}

spring.datasource.url=jdbc:oracle:thin:@dbfullstack3_tp?TNS_ADMIN=/Wallet_dbfullstack3
spring.datasource.username=foro_usuarios
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

server.port=8081

management.endpoints.web.exposure.include=health,info

jwt.secreto=${JWT_SECRETO}
jwt.minutos-validez=60

cors.origen=${CORS_ORIGEN:http://localhost:3000}
